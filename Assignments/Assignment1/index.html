<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Project</title>

 
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="container">

  <form method="post" action="#" class="mt-4">

    <!-- First / Last Name -->
    <div class="row g-3">
      <div class="col-md-6">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" id="firstName" name="firstName"
               class="form-control" required>
      </div>

      <div class="col-md-6">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" id="lastName" name="lastName"
               class="form-control" required>
      </div>
    </div>

    <!-- Address -->
    <div class="mt-3">
      <label for="address" class="form-label">Address</label>
      <input type="text" id="address" name="address"
             class="form-control" required>
    </div>

    <!-- City / State / Zip -->
    <div class="row g-3 mt-0">
      <div class="col-md-6">
        <label for="city" class="form-label">City</label>
        <input type="text" id="city" name="city"
               class="form-control" required>
      </div>

      <div class="col-md-4">
        <label for="state" class="form-label">State</label>
        <select id="state" name="state"
                class="form-select" required>
          <option value="OH">Ohio</option>
          <option value="IN">Indiana</option>
          <option value="MI" selected>Michigan</option>
          <option value="IL">Illinois</option>
          <option value="WI">Wisconsin</option>
        </select>
      </div>

      <div class="col-md-2">
        <label for="zip" class="form-label">Zip</label>
        <input type="text" id="zip" name="zip"
               class="form-control" required>
      </div>
    </div>

    <!-- Phone / Email -->
    <div class="row g-3 mt-0">
      <div class="col-md-6">
        <label for="phone" class="form-label">Phone</label>
        <input type="tel" id="phone" name="phone"
               class="form-control" required>
      </div>

      <div class="col-md-6">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email"
               class="form-control" required>
      </div>
    </div>

    <!-- Preferred contact -->
    <fieldset class="mt-3">
      <legend class="col-form-label pt-0">
        Preferred method of contact
      </legend>

      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio"
               id="contactEmail" name="preferredContact"
               value="email" required>
        <label class="form-check-label" for="contactEmail">
          Email
        </label>
      </div>

      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio"
               id="contactText" name="preferredContact"
               value="text" required>
        <label class="form-check-label" for="contactText">
          Text
        </label>
      </div>
    </fieldset>

    <button type="submit" class="btn btn-primary mt-3">
      Sign in
    </button>


  </form>

</body>
</html>
